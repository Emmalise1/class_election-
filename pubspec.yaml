name: class_election
description: "A beautiful app to run a class election live."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  provider: ^6.1.5+1
  image_picker: ^1.2.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# ADD THIS AT THE VERY BOTTOM (No spaces before flutter_launcher_icons:)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"